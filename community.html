<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>은빛담 커뮤니티</title><link rel="stylesheet" href="style.css"><style>.community{max-width:950px;margin:auto;padding:70px 20px;color:#493629}.community h1{text-align:center;font:normal 42px Georgia,serif}.community>p{text-align:center;color:#8b7463}.communityGrid{display:grid;grid-template-columns:1fr 1.5fr;gap:25px;margin-top:45px}.communityBox{background:#faf6f0;border:1px solid #e4d6c6;padding:25px}.community input,.community textarea{box-sizing:border-box;width:100%;padding:12px;margin:7px 0;border:1px solid #d7c8b7}.community button{background:#604937;color:white;border:0;padding:11px;margin:4px;cursor:pointer}.community button:disabled{opacity:.5}.community .secondary{background:#e6d9cc;color:#453528}.community .entry{border-bottom:1px solid #dfd3c6;padding:15px 0}.community .entry p{overflow-wrap:anywhere;white-space:pre-wrap}.community .status{font-size:13px;color:#846b57}@media(max-width:700px){.communityGrid{grid-template-columns:1fr}}</style></head><body><header class="header"><a class="brand" href="index.html"><img src="assets/logo.png" alt="은빛담"></a><button class="menuBtn" aria-label="메뉴">☰</button><nav><a href="index.html">HOME</a><a href="shop.html">SHOP</a><a href="stones.html">원석 이야기</a><a href="story.html">브랜드 스토리</a><a href="guide.html">주얼리 가이드</a><a href="community.html">커뮤니티</a><a href="contact.html">고객센터</a></nav></header><main class="community"><h1>은빛담에 남기는 한마디</h1><p>원석을 좋아하는 사람들의 작은 공간입니다. 누구나 읽고, 회원은 글을 남길 수 있습니다.</p><div class="communityGrid"><section class="communityBox"><h2>은빛담 회원</h2><p id="authInfo" class="status"></p><div id="authForms"><input id="email" type="email" placeholder="이메일"><input id="password" type="password" minlength="8" placeholder="비밀번호 (8자 이상)"><input id="nickname" maxlength="20" placeholder="닉네임 (선택사항)"><button id="signIn">로그인</button><button id="signUp" class="secondary">간편 회원가입</button><button id="resetPassword" class="secondary">비밀번호 찾기</button><p class="status">처음 방문하셨다면 이메일과 비밀번호(8자 이상)만으로 가입할 수 있습니다. 가입 후 받은 인증 메일을 확인해 주세요.</p></div><button id="signOut" hidden>로그아웃</button><p id="authStatus" class="status" role="status"></p></section><section class="communityBox"><h2>한 줄 이야기</h2><p class="status">광고나 개인정보 없이 따뜻한 한마디를 남겨주세요.</p><form id="postForm"><textarea id="message" maxlength="150" rows="3" disabled placeholder="로그인 후 작성할 수 있습니다."></textarea><button id="postBtn" disabled>한마디 남기기</button><small id="counter">0 / 150</small></form><p id="postStatus" class="status" role="status"></p><div id="entries"></div></section></div></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="community.js?v=2"></script><script src="script.js"></script></body></html>
