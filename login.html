<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>은빛담 관리자 로그인</title><meta name="robots" content="noindex, nofollow"><link rel="stylesheet" href="style.css"></head><body class="loginBody"><main class="loginCard"><a href="index.html"><img src="assets/logo.png" alt="은빛담"></a><small>EUNBITDAM ADMIN</small><h1>관리자 로그인</h1><p>등록된 관리자 계정으로 로그인해 주세요.</p><form id="loginForm"><label>이메일<input id="loginEmail" type="email" autocomplete="username" required></label><label>비밀번호<input id="loginPassword" type="password" autocomplete="current-password" required></label><button type="submit">로그인</button><p id="loginMessage" class="loginMessage" aria-live="polite"></p></form><button type="button" id="forgotPassword" style="margin:12px auto;display:block;background:none;border:0;text-decoration:underline;cursor:pointer;color:#604937">비밀번호를 잊으셨나요? 재설정 메일 받기</button><section id="resetPanel" hidden><label>새 비밀번호 (8자 이상)<input id="newPassword" type="password" minlength="8" autocomplete="new-password"></label><button type="button" id="saveNewPassword">새 비밀번호 저장</button></section><a class="loginHome" href="index.html">← 홈페이지로 돌아가기</a></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="login.js"></script></body></html>
