<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>원석 이야기 | 은빛담</title>
<link rel="stylesheet" href="style.css?v=20260929-5">
<style>
.stonesPage{background:#fbf8f3;min-height:70vh;padding:72px 24px 100px;color:#3c2c21}
.stonesIntro{max-width:1180px;margin:0 auto 44px;text-align:center}
.stonesIntro small{font:13px Georgia,serif;letter-spacing:.24em;color:#9a6c4d}
.stonesIntro h1{font:400 46px/1.25 Georgia,"Noto Serif KR",serif;margin:12px 0 14px;color:#39281d}
.stonesIntro>p{font-size:17px;line-height:1.8;color:#76675c;margin:0}
.stonesNotice{max-width:1180px;margin:0 auto 34px;padding:14px 20px;border-top:1px solid #ded1c3;border-bottom:1px solid #ded1c3;text-align:center;font-size:13px;line-height:1.7;color:#96745d}
.stonesGrid{max-width:1380px;margin:0 auto;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:28px}
.stoneCard{background:#fffdf9;border:1px solid #ded1c3;box-shadow:0 10px 28px rgba(76,55,39,.05);overflow:hidden}
.stonePhoto{width:100%;aspect-ratio:16/8.7;background:#eee6dc;overflow:hidden}
.stonePhoto img{width:100%;height:100%;display:block;object-fit:cover}.stonePhoto.dual{display:block;position:relative;background:#eee6dc}.stonePhoto.dual img:first-child{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}.stonePhoto.dual img:last-child{position:absolute;right:5%;bottom:6%;width:43%;height:58%;object-fit:cover;border:8px solid #fffdf9;box-shadow:0 8px 24px rgba(52,34,24,.20);z-index:2}
.stoneBody{padding:24px 38px 34px}
.stoneEnglish{display:block;font:14px Georgia,serif;letter-spacing:.22em;color:#9a6747;margin-bottom:10px;text-transform:uppercase}
.stoneName{font:400 38px/1.3 Georgia,"Noto Serif KR",serif;margin:0 0 28px;color:#352319}
.stoneSection{border-top:1px solid #eee4da;padding-top:18px;margin-top:18px}
.stoneSection:first-of-type{border-top:0;padding-top:0}
.stoneSection h3{font-size:21px;line-height:1.5;margin:0 0 8px;color:#75431f}
.stoneSection p{font-family:"Noto Serif KR","Apple SD Gothic Neo",serif;font-size:17px;line-height:1.9;margin:0;color:#68594e;word-break:keep-all}
.stoneSymbol{margin-top:20px;padding:17px 0 0;border-top:1px solid #e6d8c9;background:transparent;font-size:17px;line-height:1.7;color:#765039}
.stonesLoading{grid-column:1/-1;text-align:center;padding:60px;color:#8c7a6b}
@media(max-width:760px){.stonesPage{padding:48px 16px 70px}.stonesIntro h1{font-size:38px}.stonesGrid{grid-template-columns:1fr;gap:24px}.stoneBody{padding:24px 22px 28px}.stoneName{font-size:30px}.stoneSection p{font-size:16px}}
</style>
</head>
<body>
<header class="header"><a class="brand" href="index.html"><img src="assets/logo.png" alt="은빛담 Eunbitdam"></a><button class="menuBtn" aria-label="메뉴">☰</button><nav><a href="index.html">HOME</a><a href="shop.html">SHOP</a><a href="stones.html">원석 이야기</a><a href="story.html">브랜드 스토리</a><a href="guide.html">주얼리 가이드</a><a href="contact.html">고객센터</a></nav></header>
<main class="stonesPage">
<section class="stonesIntro"><small>STORIES HELD IN STONE</small><h1>원석 이야기</h1><p>자연이 만든 시간과 사람들이 오래도록 간직해 온 상징을 함께 읽습니다.</p></section>
<p class="stonesNotice">아래 내용은 역사적·문화적 전승과 원석 문화에서 전해지는 상징을 소개하며 의학적 효능을 의미하지 않습니다.</p>
<section class="stonesGrid" id="stonesGrid"><p class="stonesLoading">원석 이야기를 불러오는 중입니다.</p></section>
</main>
<footer><div><img src="assets/logo.png" alt="은빛담"><p>빛을 담고, 이야기를 담는 주얼리.</p></div><div><b>고객 안내</b><a href="contact.html">배송/교환/반품</a><a href="guide.html">주얼리 관리법</a><a href="contact.html">문의하기</a></div><div><b>SHOP</b><a href="shop.html">전체 상품</a><a href="stones.html">원석 이야기</a></div><p class="copy">© Eunbitdam Jewelry Shop</p></footer>
<script>
const U='https://jkyavwcdzkityyqsazel.supabase.co';
const K='sb_publishable_dNe8kUYYQfh6m6umLmCgtQ_vrb1YfZK';
const E=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
(async()=>{const grid=document.getElementById('stonesGrid');try{
 const r=await fetch(U+'/rest/v1/stones?select=*&order=id.asc',{headers:{apikey:K,Authorization:'Bearer '+K},cache:'no-store'});
 if(!r.ok)throw new Error(await r.text()); const rows=await r.json();
 const curated=[{
 name:"자수정 · Amethyst",
 features:"석영 계열의 원석으로, 미량의 철 성분과 자연 방사선의 영향으로 연한 라벤더색부터 짙은 보라색까지 다양한 색을 띱니다. 암석의 빈 공간 안에서 결정이 자라 군집이나 정동(geode)의 형태로 발견되기도 합니다.",
 story:"자수정의 영어 이름 Amethyst는 고대 그리스어 amethystos에서 유래합니다. 고대 그리스·로마 문화에서는 술에 취하지 않게 해 준다는 믿음과 연결되었고, 이후에는 절제와 맑은 정신을 상징하는 보석으로도 이야기되어 왔습니다.",
 symbolism:"평온 · 절제 · 지혜 · 맑은 정신",
 image_url:"https://commons.wikimedia.org/wiki/Special:Redirect/file/Raw%20amethyst%20crystals%201.jpg",
 bracelet_url:"https://commons.wikimedia.org/wiki/Special:Redirect/file/Banded%20Amethyst%20Bracelet.jpg", credit:"원석 사진 및 팔찌 사진: Wikimedia Commons · CC 라이선스"
 }];
 const names=new Set(rows.map(s=>String(s.name||"").toLowerCase()));
 const all=rows.concat(curated.filter(s=>!names.has(s.name.toLowerCase())));
 grid.innerHTML=all.map(s=>{const parts=String(s.name||'').split('·');const ko=(parts[0]||'').trim();const en=(parts.slice(1).join('·')||ko).trim();
 return '<article class="stoneCard"><div class="stonePhoto'+(s.bracelet_url?' dual':'')+'">'+(s.image_url?'<img src="'+E(s.image_url)+'" alt="'+E(ko)+' 원석" loading="lazy">':'')+(s.bracelet_url?'<img src="'+E(s.bracelet_url)+'" alt="'+E(ko)+' 팔찌" loading="lazy">':'')+'</div><div class="stoneBody"><small class="stoneEnglish">'+E(en)+'</small><h2 class="stoneName">'+E(ko)+'</h2><div class="stoneSection"><h3>자연적 특징</h3><p>'+E(s.features)+'</p></div><div class="stoneSection"><h3>전해지는 이야기</h3><p>'+E(s.story)+'</p></div><div class="stoneSymbol"><strong>전해지는 상징</strong> · '+E(s.symbolism)+'</div></div></article>'}).join('');
}catch(e){console.error(e);grid.innerHTML='<p class="stonesLoading">원석 이야기를 불러오지 못했습니다.</p>';}})();
</script>
<script src="script.js?v=20260929-5"></script>
</body></html>
